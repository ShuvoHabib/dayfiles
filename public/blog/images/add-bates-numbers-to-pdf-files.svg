<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Add Bates numbers to PDF files</title><desc id="desc">Three document pages carry continuous CASE page numbers.</desc>
  <defs><linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#071a3d"/><stop offset="1" stop-color="#155eef"/></linearGradient></defs>
  <rect width="1200" height="630" fill="url(#bg)"/><text x="88" y="105" fill="#8bdcff" font-family="Arial,sans-serif" font-size="28" font-weight="700">PRIVATE PDF WORKFLOW</text>
  <text x="88" y="172" fill="white" font-family="Arial,sans-serif" font-size="54" font-weight="800">Bates numbering PDF</text>
  <g transform="translate(125 235) rotate(-5)"><rect width="255" height="300" rx="22" fill="white"/><path d="M42 70h170M42 112h135M42 154h154" stroke="#b7c5da" stroke-width="15"/><text x="128" y="262" text-anchor="middle" fill="#155eef" font-family="monospace" font-size="25" font-weight="700">CASE-000101</text></g>
  <g transform="translate(455 215)"><rect width="255" height="320" rx="22" fill="white"/><path d="M42 70h170M42 112h135M42 154h154" stroke="#b7c5da" stroke-width="15"/><text x="128" y="280" text-anchor="middle" fill="#155eef" font-family="monospace" font-size="25" font-weight="700">CASE-000102</text></g>
  <g transform="translate(785 235) rotate(5)"><rect width="255" height="300" rx="22" fill="white"/><path d="M42 70h170M42 112h135M42 154h154" stroke="#b7c5da" stroke-width="15"/><text x="128" y="262" text-anchor="middle" fill="#155eef" font-family="monospace" font-size="25" font-weight="700">CASE-000103</text></g>
</svg>
